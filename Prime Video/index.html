<!doctype html>
<html lang="en">
  <head>

    <title>Prime Video:Watch Movie,Tv Show</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./Assets/images/favicon.ico" type="image" />
  </head>
  <body>
    <nav>
      <div class="nav-bar">
        <div class="left-nav">
          <img
            src="https://m.media-amazon.com/images/G/01/digital/video/web/logo-min-remaster.png"
          />
          <a href="#">Home</a>
          <a href="#">Movie</a>
          <a href="#">TV Show</a>
          <a href="#">Live Tv</a>
          <span class="Vertical">|</span>
          <div class="prime-logo">
            <img
              class="prime"
              src="https://m.media-amazon.com/images/G/01/digital/video/merch/subs/benefit-id/m-r/Prime/logos/channels-logo-white._CB554929912_SY45_FMwebp_.png"
            />
          </div>

          <a href="#"><i class="ri-gallery-view-2"></i>Subscription</a>
        </div>
        <div class="right-nav">
          <a href=""><i class="ri-search-line"></i></a>
          <a href=""><i class="ri-grid-fill"></i></a>
          <a href=""><i class="ri-bookmark-line"></i></a>
          <a href=""><i class="ri-user-line"></i></a>
        </div>
      </div>

    <section class="hero">
        <div class="hero-content">
            <img class="hero-prime-logo" src="https://m.media-amazon.com/images/G/01/digital/video/merch/subs/benefit-id/m-r/Prime/logos/channels-logo-color._CB554929912_SY52.5_FMwebp_.png"/>

            <span class="hero-rank-movie"><i class="ri-arrow-right-up-long-line"></i> #3 in india</span>
            <p class="hero-season">Season 1・Private eye Ben Reilly is living easy and lazy...until<br/> mobsters, monsters, and a femme fatale drag him back to...</p>
            <div>
                <button class="join-prime-hero">Join Prime <br/>Watch now</button>
                <span class="add-bag"><i class="ri-add-circle-line"></i></span>
                <span class="info-bag"><i class="ri-information-line"></i></span>
            </div>
            <span class="check-hero"><i class="ri-check-line"></i> Included with prime</span>
        </div>
    </section>
  </body>
